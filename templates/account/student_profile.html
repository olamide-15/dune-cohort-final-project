{% extends 'base.html' %}

{% block title %}My Profile{% endblock %}

{% block content %}

<div class="page-header">
    <h1>My Profile</h1>
</div>

<div class="container">
    <div class="card" style="max-width:550px;">

        <!-- Avatar -->
        <div style="text-align:center; margin-bottom:24px;">
            {% if student.image %}
                <img src="{{ student.image.url }}"
                     alt="Profile Photo"
                     style="width:100px; height:100px; border-radius:50%; object-fit:cover;">
            {% else %}
                <div class="avatar-placeholder" style="margin:0 auto; width:100px; height:100px; font-size:40px;">
                    {{ student.get_full_name|first }}
                </div>
            {% endif %}
            <h2 style="margin-top:12px;">{{ student.get_full_name }}</h2>
            <p style="color:#aaa; font-size:13px;">{{ student.role|capfirst }}</p>
        </div>

        <!-- Details -->
        <div class='container'>
            <p>
                <label>Username</label>
                <input type="text" value="{{ student.username }}" disabled>
            </p>
            <p>
                <label>Email</label>
                <input type="text" value="{{ student.email }}" disabled>
            </p>
            <p>
                <label>Courses</label>
                <input type="text" value="{{ student.course }}" disabled>
            </p>
            <p>
                <label>Phone</label>
                <input type="text" value="{{ student.phone|default:'—' }}" disabled>
            </p>
            <p>
                <label>Class</label>
                <input type="text" value="{{ student.class_name|default:'—' }}" disabled>
            </p>
        </div>

    </div>
</div>

{% endblock %}
